:root {
  --bg: #9A4D61;
  --ink: #4E2846;
  --ink-soft: #6A3F5B;
  --line: rgba(78, 40, 70, .35);
  --well: rgba(78, 40, 70, .14);
  --card: #F3EAEC;
  --gothic: "Messenia Gothic", serif;
  --practical: "Messenia Practical", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--practical); font-size: 17px; line-height: 1.45; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px 0;
  display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
}
main { width: 100%; max-width: 380px; margin: 0 auto; display: grid; gap: 20px; position: relative; z-index: 1; }
.sigil { display: block; width: 30px; height: auto; margin-bottom: -6px; }
.sigil path { fill: var(--ink); }
h1 { font-family: var(--gothic); font-weight: 400; font-size: 2.4rem; line-height: 1.1; color: var(--ink); margin: 0 0 4px; min-height: 1.1em; }
.cursor { display: inline-block; width: .4em; height: .78em; vertical-align: -.02em; margin-left: .06em; background: var(--ink); animation: blink .7s steps(2, start) infinite; }
.cursor.out { animation: cursor-out .3s ease forwards; }
@keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes cursor-out { to { opacity: 0; width: 0; margin: 0; } }
label { display: grid; gap: 6px; font-size: 0.95rem; color: var(--ink); }
input {
  width: 100%; font: 1.05rem var(--practical); letter-spacing: 0.02em; color: var(--ink);
  background: var(--well); border: 1px solid var(--line); border-radius: 4px; padding: 11px 13px;
}
input::placeholder { color: var(--ink-soft); opacity: .8; }
input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.qr { border: 1px solid var(--line); border-radius: 4px; padding: 10px; background: var(--card); }
.qr img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
p { margin: 0; font-size: 0.9rem; color: var(--ink-soft); }
.coda { margin-top: auto; padding-top: 24px; display: flex; justify-content: center; pointer-events: none; }
.coda img { display: block; width: min(92vw, 520px); height: auto; margin-bottom: -22%; opacity: .55;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 55%); mask-image: linear-gradient(to bottom, transparent 0%, #000 55%); }
@media (prefers-reduced-motion: no-preference) {
  .coda img { animation: coda 2.4s ease-out 0.3s both; }
  @keyframes coda { from { opacity: 0; transform: scale(.92); } to { opacity: .55; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { .cursor { display: none; } }
@media (min-width: 900px) {
  body { font-size: 18px; padding-block: 64px 0; }
  main { max-width: 440px; }
  h1 { font-size: 2.8rem; }
  .sigil { width: 34px; }
}
</style>

<script>
const user = document.getElementById("user"), pass = document.getElementById("pass"), img = document.getElementById("qr");

function render() {
  const empty = !user.value && !pass.value;
  document.getElementById("box").hidden = empty;
  document.getElementById("hint").textContent = empty ? "Type a user name and password to make the code." : "Long-press or right-click the code to save it.";
  if (empty) return;
  const qr = qrcode(0, "L");
  qr.addData(user.value + "\t" + pass.value + "\r", "Byte");
  qr.make();
  const n = qr.getModuleCount(), s = 10, q = 4, size = (n + q * 2) * s;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.fillStyle = "#F3EAEC"; g.fillRect(0, 0, size, size);
  g.fillStyle = "#4E2846";
  for (let r = 0; r < n; r++)
    for (let col = 0; col < n; col++)
      if (qr.isDark(r, col)) g.fillRect((col + q) * s, (r + q) * s, s, s);
  img.src = c.toDataURL("image/png");
}

user.addEventListener("input", render);
pass.addEventListener("input", render);
render();

// The title types in once behind a block cursor, as on messenia.ink, after the fonts are in.
const title = document.getElementById("title"), cursor = title.querySelector(".cursor"), line = title.firstChild.textContent;
if (matchMedia("(prefers-reduced-motion: reduce)").matches) { cursor.remove(); }
else {
  title.firstChild.textContent = "";
  document.fonts.ready.then(() => {
    let i = 0;
    const type = () => { title.insertBefore(document.createTextNode(line[i++]), cursor);
      if (i < line.length) setTimeout(type, line[i - 1] === " " ? 150 : 60 + Math.random() * 50);
      else setTimeout(() => { cursor.classList.add("out"); setTimeout(() => cursor.remove(), 400); }, 700); };
    setTimeout(type, 300);
  });
}
</script>
</body>
</html>
