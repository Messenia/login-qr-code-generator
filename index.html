:root {
  --white: #FFFFFF;
  --grey: #474747;
  --text: #1A1A1A;
  --label: #262626;
  --dim: #666666;
  --border: #999999;
  --tint: #F7F7F7;
  --rule: #DEDEDE;
  --practical: "Messenia Practical", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--white); }
body {
  background: var(--white); color: var(--text); font-family: var(--practical); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px 0;
  display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
}
main { width: 100%; max-width: 380px; margin: 0 auto; display: grid; gap: 20px; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 0; }
h1 { font-family: var(--practical); font-weight: 400; font-size: 2.2rem; line-height: 1.1; color: var(--text); margin: 0 0 4px; text-wrap: balance; }
label { display: grid; gap: 6px; font-size: 0.95rem; color: var(--label); }
input {
  width: 100%; font: 1.05rem var(--practical); letter-spacing: 0.02em; color: var(--text);
  background: var(--tint); border: 1px solid var(--border); border-radius: 4px; padding: 11px 13px;
}
input::placeholder { color: var(--border); }
input:focus { outline: none; border-color: var(--grey); background: var(--white); box-shadow: 0 0 0 1px var(--grey); }
.qr { border: 1px solid var(--rule); border-radius: 4px; padding: 10px; background: var(--white); }
.qr img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
p { margin: 0; font-size: 0.9rem; color: var(--dim); }
.sigil { display: block; width: 22px; height: auto; opacity: 0.45; mix-blend-mode: multiply; margin-bottom: -8px; }
.coda { margin-top: auto; padding-top: 24px; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); margin-bottom: calc(-1 * env(safe-area-inset-bottom, 0px)); }
.coda img { display: block; width: 100%; max-width: 100%; height: clamp(260px, 70vw, 480px); object-fit: cover; object-position: center 55%;
  opacity: 0.42; filter: saturate(0.45); mix-blend-mode: multiply;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 70%), linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to bottom, transparent 0%, #000 70%), linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
  mask-composite: intersect; }
@media (prefers-reduced-motion: no-preference) {
  .coda img { animation: coda 2.4s ease-out 0.3s both; }
  @keyframes coda { from { opacity: 0; } to { opacity: 0.42; } }
}
</style>

<script>
const user = document.getElementById("user"), pass = document.getElementById("pass"), img = document.getElementById("qr");

function render() {
  const empty = !user.value && !pass.value;
  document.getElementById("box").hidden = empty;
  document.getElementById("hint").textContent = empty ? "Type a user name and password to make the code." : "Long-press or right-click the code to save it.";
  if (empty) return;
  const qr = qrcode(0, "L");
  qr.addData(user.value + "\t" + pass.value + "\r", "Byte");
  qr.make();
  const n = qr.getModuleCount(), s = 10, q = 4, size = (n + q * 2) * s;

  c.width = c.height = size;

  g.fillStyle = "#fff"; g.fillRect(0, 0, size, size);
  g.fillStyle = "#000";
  for (let r = 0; r < n; r++)

      if (qr.isDark(r, col)) g.fillRect((col + q) * s, (r + q) * s, s, s);
  img.src = c.toDataURL("image/png");
}

user.addEventListener("input", render);
pass.addEventListener("input", render);
render();
</script>
