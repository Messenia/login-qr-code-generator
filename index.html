:root {
  --white: #FFFFFF;
  --grey: #474747;
  --text: #1A1A1A;
  --label: #262626;
  --dim: #666666;
  --border: #999999;
  --tint: #F7F7F7;
  --rule: #DEDEDE;
  --gothic: "Messenia Gothic", "UnifrakturMaguntia", Georgia, serif;
  --practical: "Messenia Practical", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--white); }
body {
  background: var(--white); color: var(--text); font-family: var(--practical); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px 56px;
}
main { max-width: 380px; margin: 0 auto; display: grid; gap: 20px; }
.mark { display: block; width: 64px; height: auto; margin: 28px auto 0; }
.mark path { fill: var(--rule); }
hr { border: 0; border-top: 1px solid var(--rule); margin: 0; }
h1 { font-family: var(--gothic); font-weight: 400; font-size: 2.3rem; line-height: 1.1; color: var(--text); margin: 0 0 4px; text-wrap: balance; }
label { display: grid; gap: 6px; font-size: 0.95rem; color: var(--label); }
input {
  width: 100%; font: 1.05rem var(--practical); letter-spacing: 0.02em; color: var(--text);
  background: var(--tint); border: 1px solid var(--border); border-radius: 4px; padding: 11px 13px;
}
input::placeholder { color: var(--border); }
input:focus { outline: none; border-color: var(--grey); background: var(--white); box-shadow: 0 0 0 1px var(--grey); }
.qr { border: 1px solid var(--rule); border-radius: 4px; padding: 10px; background: var(--white); }
.qr img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
p { margin: 0; font-size: 0.9rem; color: var(--dim); }
</style>

<script>
const user = document.getElementById("user"), pass = document.getElementById("pass"), img = document.getElementById("qr");

  const empty = !user.value && !pass.value;

  for (let r = 0; r < n; r++)

}
